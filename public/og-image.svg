<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#021427" />
    </linearGradient>
    <linearGradient id="brandLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <circle cx="600" cy="200" r="450" fill="url(#glow)" />

  <!-- Logo container -->
  <g transform="translate(540, 110)">
    <rect width="120" height="120" rx="30" fill="url(#brandLogoGrad)" />
    <!-- MessageCircle icon -->
    <path d="M86 58C86 71.2548 74.3594 82 60 82C55.4851 82 51.2519 80.9168 47.6112 79.0125L30 84L35.0469 70.4958C31.8837 66.9274 30 62.3168 30 58C30 44.7452 41.6406 34 60 34C78.3594 34 86 44.7452 86 58Z" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Brand Title -->
  <text x="600" y="310" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="64" fill="#ffffff" letter-spacing="-1.5">
    Echo<tspan fill="url(#textGrad)">GPT</tspan>
  </text>

  <!-- Tagline -->
  <text x="600" y="375" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="30" fill="#94a3b8">
    One Unified Chat for Every AI Model
  </text>

  <!-- Sub-caption -->
  <text x="600" y="425" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="20" fill="#64748b">
    GPT-4o • Claude 3.5 • Gemini 1.5 • Llama 3.1 • Mistral • Perplexity
  </text>

  <!-- Feature pill badges -->
  <g transform="translate(300, 480)">
    <rect x="0" y="0" width="180" height="44" rx="22" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="90" y="27" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="16" fill="#38bdf8">Side-by-Side</text>

    <rect x="210" y="0" width="180" height="44" rx="22" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="300" y="27" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="16" fill="#38bdf8">Live Switching</text>

    <rect x="420" y="0" width="180" height="44" rx="22" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="510" y="27" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="16" fill="#38bdf8">Chrome Extension</text>
  </g>
</svg>
